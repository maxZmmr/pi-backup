name: Build Raspberry Pi Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-pi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl

      - name: Install Cross
        uses: taiki-e/install-action@cross

      - name: Build binary (ARM64 musl)
        run: cross build --target aarch64-unknown-linux-musl --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-backup-arm64
          path: target/aarch64-unknown-linux-musl/release/pi-backup
