age_public_key = "public key"
rclone_remote = "gdrive:raspi_backups"

[jobs.vaultwarden]
sqlite_db = "test.db"
keep_last = 14
healthcheck_url = "https://hc-ping.com/<USER UUID>"

[jobs.system_config]
include_paths = [
    "path/to/include",
    "another/path"
]
keep_last = 7

[jobs.random]
sqlite_db = "test.db"
include_paths = [
    "path/to/include",
    "another/path"
]
keep_last = 2
preserve_paths = true
