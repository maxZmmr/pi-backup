[package]
name = "pi-backup"
version = "0.1.0"
edition = "2021"
description = "Lightweight in-memory streaming backup tool & watchdog for Raspberry Pis"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tempfile = "3.10"
toml = "0.8"
anyhow = "1.0"
tar = "0.4"
zstd = "0.13"
age = "0.10"
chrono = "0.4"
ureq = "2.9"
